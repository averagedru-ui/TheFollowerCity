<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asset Lab</title>
<style>
  :root { --bg:#f3ecd9; --card:#fbf6e8; --ink:#4a3f33; --line:#e2d8bd; --accent:#e8b84a; }
  body.dark { --bg:#23291f; --card:#2d352a; --ink:#e9e2cf; --line:#3d4738; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:600 14px/1.4 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:14px 20px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  h1 { margin:0 12px 0 0; font-size:20px; }
  #bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:6px 12px; border-radius:999px; cursor:pointer; }
  button.on { background:var(--accent); border-color:var(--accent); color:#3a2c12; }
  .sep { width:1px; height:22px; background:var(--line); margin:0 4px; }
  main { padding:8px 20px 60px; }
  h2 { margin:26px 0 10px; font-size:15px; letter-spacing:.08em; text-transform:uppercase; opacity:.7; }
  .row { display:flex; flex-wrap:wrap; gap:14px; }
  .card { margin:0; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer; transition:transform .12s; }
  .card:hover { transform:translateY(-2px); }
  .card canvas { display:block; }
  figcaption { padding:6px 12px 10px; font-size:12px; opacity:.75; }
  select { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:6px 10px; border-radius:999px; }
  .hint { font-weight:500; opacity:.6; font-size:12px; }
</style>
</head>
<body>
<header><h1>Asset Lab</h1><div id="bar"></div><span class="hint">click a card to save PNG</span> <span class="hint" id="status"></span></header>
<main id="grid"></main>
<script type="module" src="src/viewer.js"></script>
</body>
</html>
