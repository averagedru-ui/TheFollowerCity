<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Map</title>
<style>
  :root { --bg:#f3ecd9; --card:#fbf6e8; --ink:#4a3f33; --line:#e2d8bd; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:600 13px/1.4 system-ui, sans-serif; }
  #view { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  #view:active { cursor:grabbing; }
  header { position:absolute; top:12px; left:12px; right:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; pointer-events:none; }
  header > * { pointer-events:auto; }
  h1 { margin:0 8px 0 0; font-size:17px; background:var(--card); padding:6px 14px; border-radius:999px; border:1px solid var(--line); }
  #bar { display:flex; gap:8px; flex-wrap:wrap; }
  button, select { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:6px 12px; border-radius:999px; cursor:pointer; }
  #info { position:absolute; left:12px; bottom:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px 12px; font-weight:500; font-size:12px; opacity:.92; }
  #mini { position:absolute; right:12px; bottom:12px; width:180px; height:180px; border-radius:12px; border:3px solid var(--card); box-shadow:0 2px 10px rgba(0,0,0,.18); image-rendering:pixelated; cursor:pointer; background:#6aa5c8; }
  #planTools, #plotOpts { display:none; }
  #pname { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); padding:6px 12px; border-radius:999px; width:130px; }
  button.primary { background:#58a37a; border-color:#58a37a; color:#fff; }
  #panel .note { font-weight:500; font-size:12px; margin-top:6px; color:#8a5a2a; }
  #build { display:none; position:absolute; inset:0; background:rgba(60,50,35,.38); align-items:center; justify-content:center; z-index:5; }
  .bcard-wrap { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; width:min(760px,94vw); max-height:88vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  .bgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin:12px 0; }
  .bcard { display:flex; flex-direction:column; align-items:center; border-radius:14px; padding:6px; background:#fff; border:1px solid var(--line); }
  .bcard:hover { border-color:#58a37a; box-shadow:0 0 0 2px #58a37a55; }
  .bname { font-size:12px; margin-top:2px; }
  button.on { background:#4a3f33; color:#fbf6e8; border-color:#4a3f33; }
  button.danger { color:#b3392f; }
  #hint { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); padding:6px 14px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:12px; pointer-events:none; }
  #hint:empty { display:none; }
  #hint.ok { border-color:#58a37a; } #hint.bad { border-color:#e0506a; color:#b3392f; }
  #toast { position:absolute; top:64px; left:50%; transform:translate(-50%,-8px); padding:8px 16px; border-radius:999px; background:#4a3f33; color:#fbf6e8; opacity:0; transition:.2s; pointer-events:none; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #panel { display:none; position:absolute; right:12px; top:64px; width:240px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:0 4px 18px rgba(0,0,0,.14); }
  #panel .ptitle { font-size:15px; font-weight:800; } #panel .pmeta { font-weight:500; font-size:12px; opacity:.75; margin:2px 0 8px; }
  #panel label { display:block; font-size:11px; opacity:.8; margin-top:6px; } #panel input, #panel select { width:100%; margin-top:2px; border-radius:8px; padding:5px 8px; }
  #panel input { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); }
  .prow { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; } .prow button { padding:5px 10px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<header><h1>World Map</h1><div id="bar"><span id="planTools"><span id="plotOpts"></span></span></div></header>
<div id="info"><span id="status"></span> &middot; <span id="perf"></span> &middot; drag to pan, wheel to zoom, WASD/arrows, click a plot to claim it</div>
<div id="hint"></div><div id="toast"></div><div id="panel"></div>
<div id="build"></div>
<canvas id="mini"></canvas>
<script type="module" src="src/map/mapview.js"></script>
</body>
</html>
